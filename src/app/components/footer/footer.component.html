<footer class="site-footer" role="contentinfo">
  <div class="wrap">
    <div class="footer-top">
      <a href="#hero" class="footer-brand">
        <span class="footer-mark" aria-hidden="true">AE</span>
        <span>
          <span class="footer-name">Anass EREKYSY</span>
          <span class="footer-tag">Full-Stack SaaS / Web Developer</span>
        </span>
      </a>

    <nav class="footer-links" aria-label="Profiles">
      <a *ngFor="let p of profiles" [href]="p.url" target="_blank" rel="noopener noreferrer"
         class="footer-icon" [attr.aria-label]="p.name" [title]="p.name" [style.--brand]="p.color">
        <svg class="" [attr.viewBox]="p.viewBox" aria-hidden="true"
                   [attr.fill]="p.stroke ? 'none' : 'currentColor'"
                   [attr.stroke]="p.stroke ? 'currentColor' : null"
                   [attr.stroke-width]="p.stroke ? 2.6 : null"
                   stroke-linecap="round">
                <path [attr.d]="p.path" />
              </svg>
      </a>
      <a href="mailto:ereanass@gmail.com" class="footer-icon" aria-label="Email" title="Email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="1" />
          <path d="M3 7l9 6 9-6" />
        </svg>
      </a>
    </nav>
    </div>

    <div class="footer-bottom">
      <p>&copy; {{ currentYear }} Anass EREKYSY. All rights reserved.</p>
      <a href="#hero" class="to-top" aria-label="Back to top">↑</a>
    </div>
  </div>
</footer>
