<header class="site-header" [class.scrolled]="scrolled() || menuOpen()" role="banner">
  <div class="wrap header-inner">
    <a href="#hero" class="brand" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">AE</span>
      <span class="brand-name">Anass EREKYSY</span>
    </a>

    <nav class="header-nav" aria-label="Main">
      <a
        *ngFor="let item of nav"
        [href]="'#' + item.id"
        [class.active]="active() === item.id"
      >{{ item.key | translate }}</a>
    </nav>

    <div class="header-tools">
      <div class="lang" role="group" aria-label="Language">
        <button
          type="button"
          [class.active]="translationService.currentLanguage() === 'fr'"
          [attr.aria-pressed]="translationService.currentLanguage() === 'fr'"
          (click)="translationService.setLanguage('fr')"
        >FR</button>
        <button
          type="button"
          [class.active]="translationService.currentLanguage() === 'en'"
          [attr.aria-pressed]="translationService.currentLanguage() === 'en'"
          (click)="translationService.setLanguage('en')"
        >EN</button>
      </div>

      <button
        type="button"
        class="icon-btn"
        (click)="themeService.toggleTheme()"
        [attr.aria-label]="themeService.isDark ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        <svg *ngIf="themeService.isDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg *ngIf="!themeService.isDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.4 15.4A9 9 0 0 1 8.6 3.6 9 9 0 1 0 20.4 15.4z" />
        </svg>
      </button>

      <button
        type="button"
        class="icon-btn menu-btn"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Menu"
      >
        <span class="burger" [class.open]="menuOpen()"><i></i><i></i></span>
      </button>
    </div>
  </div>

  <nav class="mobile-nav" *ngIf="menuOpen()" aria-label="Mobile">
    <div class="wrap">
      <a
        *ngFor="let item of nav; let i = index"
        [href]="'#' + item.id"
        (click)="closeMenu()"
        [style.animation-delay.ms]="i * 50"
      >{{ item.key | translate }}</a>
    </div>
  </nav>
</header>
