<header class="site-header" role="banner">
  <div class="wrap header-inner">
    <a href="#hero" class="brand">Anass EREKYSY</a>

    <nav class="header-nav" [attr.aria-label]="'nav.main' | translate">
      <a href="#projects">{{ 'hero.projects' | translate }}</a>
      <a href="#experience">{{ 'hero.experience' | translate }}</a>
      <a href="#what-i-do">{{ 'nav.whatIDo' | translate }}</a>
      <a href="#skills">{{ 'hero.skills' | translate }}</a>
      <a href="#contact">{{ 'nav.contact' | translate }}</a>
    </nav>

    <div class="header-tools">
      <div class="lang" role="group">
        <button
          type="button"
          [class.active]="translationService.currentLanguage() === 'fr'"
          [attr.aria-pressed]="translationService.currentLanguage() === 'fr'"
          [attr.aria-label]="'nav.lang.fr' | translate"
          (click)="translationService.setLanguage('fr')"
        >FR</button>
        <span aria-hidden="true">/</span>
        <button
          type="button"
          [class.active]="translationService.currentLanguage() === 'en'"
          [attr.aria-pressed]="translationService.currentLanguage() === 'en'"
          [attr.aria-label]="'nav.lang.en' | translate"
          (click)="translationService.setLanguage('en')"
        >EN</button>
      </div>

      <button
        type="button"
        class="theme-btn"
        (click)="themeService.toggleTheme()"
        [attr.aria-label]="themeService.isDark ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        <svg *ngIf="themeService.isDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg *ngIf="!themeService.isDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.4 15.4A9 9 0 0 1 8.6 3.6 9 9 0 1 0 20.4 15.4z" />
        </svg>
      </button>
    </div>
  </div>
</header>
