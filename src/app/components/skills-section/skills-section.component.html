<section class="section" id="skills">
  <div class="wrap">

    <header class="section-head">
      <span class="section-index">04</span>
      <h2 class="section-title">{{ 'skills.title' | translate }}</h2>
      <p class="section-sub">{{ 'skills.subtitle' | translate }}</p>
    </header>

    <div>
      <div
        *ngFor="let category of skillCategories; trackBy: trackByCategoryName"
        class="row skill-row"
      >
        <h3 class="skill-cat">{{ category.name }}</h3>
        <p class="dot-list skill-items">
          <span *ngFor="let skill of category.skills; trackBy: trackBySkillName">{{ skill.name }}</span>
        </p>
      </div>

      <div class="row skill-row">
        <h3 class="skill-cat">{{ 'skills.methodologies' | translate }}</h3>
        <p class="dot-list skill-items">
          <span *ngFor="let methodology of methodologies">{{ methodology }}</span>
        </p>
      </div>
    </div>
  </div>
</section>
