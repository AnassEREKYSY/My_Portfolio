<section class="section" id="education">
  <div class="wrap">

    <header class="section-head">
      <span class="section-index">06</span>
      <h2 class="section-title">{{ 'education.title' | translate }}</h2>
      <p class="section-sub">{{ 'education.subtitle' | translate }}</p>
    </header>

    <div>
      <article *ngFor="let edu of educationList" class="row edu">
        <span class="edu-period">{{ edu.period }}</span>
        <div>
          <h3 class="edu-title">{{ edu.title }}</h3>
          <p class="edu-school">{{ edu.institution }}</p>
        </div>
        <span class="edu-location">{{ edu.location }}</span>
      </article>
    </div>
  </div>
</section>
